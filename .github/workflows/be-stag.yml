name: Backend – Build & Deploy (Staging)

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}
  TARGET_INSTANCE_ID: ${{ secrets.STAGING_INSTANCE_ID }}

permissions:
  id-token: write
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - uses: actions/checkout@v4

      # -------------------------
      # AWS Auth (OIDC)
      # -------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # -------------------------
      # Docker build & push
      # -------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Image (staging)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REPOSITORY }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------
      # Deploy to Staging (SSM)
      # -------------------------
      - name: Deploy to Staging
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$TARGET_INSTANCE_ID" \
            --comment "Deploy BACKEND STAGING $IMAGE_TAG" \
            --parameters '{
              "commands": [
                "set -e",
                "aws ecr get-login-password --region '"$AWS_REGION"' | docker login --username AWS --password-stdin '"$ECR_REPOSITORY"'",
                "docker pull '"$ECR_REPOSITORY:$IMAGE_TAG"'",
                "docker stop inai-backend-staging || true",
                "docker rm inai-backend-staging || true",
                "docker run -d \
                  --name inai-backend-staging \
                  -p 8080:8000 \
                  --restart unless-stopped \
                  -e ENVIRONMENT=staging \
                  '"$ECR_REPOSITORY:$IMAGE_TAG"'"
              ]
            }'
