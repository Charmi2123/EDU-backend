name: Backend – Deploy (Production)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}
  TARGET_INSTANCE_ID: ${{ secrets.PROD_INSTANCE_ID }}

permissions:
  id-token: write
  contents: read

jobs:
  production:
    environment: production   # 🔒 GitHub Environment approval
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # -------------------------
      # Checkout (for metadata only)
      # -------------------------
      - uses: actions/checkout@v4

      # -------------------------
      # AWS Auth (OIDC)
      # -------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # -------------------------
      # Deploy SAME image built in staging
      # -------------------------
      - name: Deploy to Production
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$TARGET_INSTANCE_ID" \
            --comment "Deploy BACKEND PROD $IMAGE_TAG" \
            --parameters '{
              "commands": [
                "set -e",
                "aws ecr get-login-password --region '"$AWS_REGION"' | docker login --username AWS --password-stdin '"$ECR_REPOSITORY"'",
                "docker pull '"$ECR_REPOSITORY:$IMAGE_TAG"'",
                "docker stop inai-backend-prod || true",
                "docker rm inai-backend-prod || true",
                "docker run -d \
                  --name inai-backend-prod \
                  -p 80:8000 \
                  --restart unless-stopped \
                  -e ENVIRONMENT=production \
                  '"$ECR_REPOSITORY:$IMAGE_TAG"'"
              ]
            }'
